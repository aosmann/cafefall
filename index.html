<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cafefall">
<meta name="theme-color" content="#f3d9b5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Cafefall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: the 3D kitchen fills the screen. HUD and order tickets on top, the question card slides up from the bottom
   (portrait) or sits on the left (landscape). Everything in 100dvh. */
:root{--ink:#2b2118;--muted:#7a6a5a;--card:#fffaf2;--line:#eadfd2;--good:#2fb36b;--goodBg:#d3f3df;--bad:#e5484d;--badBg:#ffdcdc;--accent:#e8822c;--gold:#ffc83d;
  --shadow:0 4px 0 rgba(43,33,24,.14),0 10px 24px rgba(43,33,24,.12);--font:'Nunito',system-ui,sans-serif;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f3d9b5;color:var(--ink);font:16px/1.35 var(--font);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
#top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(10px + var(--safeT)) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;transition:opacity .25s}
#top.off{opacity:0}
#hud{display:flex;align-items:center;gap:8px}
#hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font:800 17px/1 var(--font);white-space:nowrap}
.chip .coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,#ffc83d 55%,#d68b10);box-shadow:inset 0 0 0 2px rgba(150,90,0,.25)}
.chip.bump .coin{animation:pop .35s}
.chip.coins{min-width:72px;justify-content:center}
#hud{flex-wrap:nowrap}#hud .chip{flex:none}
.chip.mult{background:var(--gold);display:none}.chip.mult.on{display:inline-flex;animation:pop .4s}
.chip.low{background:#ffe1e1;color:#b3261e}
#hud .sp{flex:1}
.round{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.round svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round:active{transform:translateY(2px)}
#mute .offi{display:none}#mute[aria-pressed=false] .on{display:none}#mute[aria-pressed=false] .offi{display:inline}
#mute path:first-child{fill:var(--ink)}
@keyframes pop{40%{transform:scale(1.35)}}

/* order tickets */
#tickets{display:flex;justify-content:center;gap:8px;min-height:0}
.tk{pointer-events:auto;flex:1 1 0;min-width:0;max-width:220px;display:flex;align-items:center;gap:8px;padding:7px 9px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-align:left;transition:transform .2s,opacity .25s}
.tk:active{transform:translateY(2px)}
.tk.serving{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.tk .dishes{display:flex;flex:none}
.tk .dishes img{width:38px;height:38px;object-fit:contain;margin-right:-6px}
.tk .dishes img.done{opacity:.35}
.tk .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.tk b{font:800 13px/1.1 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk small{font:700 11px/1 var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--good);transition:background .3s}
.tk.new{animation:tkin .35s}
@media (max-width:560px){#tickets .tk{flex-direction:column;align-items:stretch;gap:5px;padding:6px 8px 8px}#tickets .tk .dishes{justify-content:center}#tickets .tk b{font-size:12px;text-align:center}#tickets .tk small{display:none}}
@media (max-width:560px){#tickets:has(.tk:nth-child(3)) .tk b{display:none}}
@keyframes tkin{from{opacity:0;transform:translateY(-10px)}}

/* markers over the customers' heads */
.mk{position:absolute;left:0;top:0;z-index:3;width:46px;height:46px;margin:-46px 0 0 -23px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;pointer-events:none;transition:opacity .2s}
.mk img{width:36px;height:36px;object-fit:contain}
.mk.face{background:var(--gold);font:900 22px/1 var(--font)}
.mk.face.sad{background:#d8dee6}
.mk::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--card)}
.mk.face::after{border-top-color:var(--gold)}.mk.face.sad::after{border-top-color:#d8dee6}

#hint{position:absolute;left:50%;bottom:calc(24px + var(--safeB));transform:translateX(-50%);z-index:4;background:var(--ink);color:#fff;font:800 15px/1.2 var(--font);padding:11px 16px;border-radius:14px;white-space:nowrap;transition:opacity .3s;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#hint.off{opacity:0}

/* ---------- question card ---------- */
#card{position:absolute;left:0;right:0;bottom:0;z-index:6;margin:0 auto;width:min(100%,640px);background:var(--card);border-radius:26px 26px 0 0;
  padding:16px 14px calc(14px + var(--safeB));box-shadow:0 -10px 30px rgba(43,33,24,.18);transition:transform .3s cubic-bezier(.2,.9,.3,1.08);display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 140px)}
#card.off{transform:translateY(112%);transition-timing-function:ease-in}
.ctop{display:flex;align-items:center;gap:10px}
.ctop img{width:42px;height:42px;object-fit:contain;flex:none}
.ctop small{display:block;font:800 11px/1 var(--font);color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.ctop b{font:900 18px/1.1 var(--font)}
#qwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:56px;overflow:auto;padding:2px 4px}
#qtag{font:800 11px/1 var(--font);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
#qtag:empty{display:none}
#qimg{height:70px;border-radius:6px;box-shadow:0 0 0 2px var(--line)}
#qtext{font:900 clamp(20px,5.4vw,30px)/1.2 var(--font)}
#qtext .code{display:block;font:700 .78em/1.35 ui-monospace,Menlo,monospace;background:#2b2118;color:#ffe8c4;padding:6px 10px;border-radius:8px;margin-bottom:6px;white-space:pre-wrap;text-align:left}
#ans{display:grid;gap:8px}
#ans button{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;border:0;background:#fff;box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line);font:800 clamp(17px,4.4vw,21px)/1.2 var(--font);text-align:left}
#ans button b{flex:none;width:28px;height:28px;border-radius:50%;background:#f1e7da;color:var(--muted);display:grid;place-items:center;font:900 14px/1 var(--font)}
#ans button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line)}
#ans button.right{background:var(--goodBg);box-shadow:0 4px 0 #8fd3a9,0 0 0 2px #8fd3a9}#ans button.right b{background:var(--good);color:#fff}
#ans button.wrong{background:var(--badBg);box-shadow:0 4px 0 #f0a3a5,0 0 0 2px #f0a3a5}#ans button.wrong b{background:var(--bad);color:#fff}
#ans button.dim{opacity:.45}
#ans.locked button{pointer-events:none}
#verdict{font:900 16px/1.2 var(--font);text-align:center}
#verdict:empty{display:none}
#verdict.good{color:#16733f}#verdict.bad{color:#b3261e}
@media (min-width:600px){#ans{grid-template-columns:repeat(3,1fr)}#ans button{flex-direction:column;justify-content:center;text-align:center;min-height:84px;gap:6px}}
@media (orientation:landscape) and (min-aspect-ratio:13/10){
  #card{left:12px;right:auto;bottom:auto;top:calc(112px + var(--safeT));width:min(48%,560px);margin:0;border-radius:24px;max-height:calc(100% - 124px - var(--safeT));padding-bottom:14px;box-shadow:var(--shadow)}
  #card.off{transform:translateX(-115%)}
  #ans{grid-template-columns:repeat(3,1fr)}#ans button{flex-direction:column;justify-content:center;text-align:center;gap:6px;min-height:64px}
  .tk{max-width:200px}
}
@media (orientation:landscape) and (max-height:500px){.chip{height:34px;font-size:15px}.round{width:36px;height:36px}.tk .dishes img{width:30px;height:30px}#qtext{font-size:19px}#ans button{min-height:48px;font-size:16px}#card{top:calc(96px + var(--safeT));gap:7px;padding:12px}}

/* ---------- banners and effects ---------- */
#banner{position:absolute;left:50%;top:32%;z-index:7;transform:translate(-50%,-50%);opacity:0;pointer-events:none;background:#fff;border-radius:18px;padding:12px 22px;
  font:900 clamp(22px,6vw,32px)/1.1 var(--font);text-align:center;box-shadow:var(--shadow);white-space:nowrap}
#banner small{display:block;font:800 14px/1.3 var(--font);color:var(--muted)}
#banner small:empty{display:none}
#banner.show{animation:ban 1.8s forwards}
#banner.gold{background:var(--gold)}#banner.bad{background:#ffe1e1}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-40%) scale(.85)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.pop{position:fixed;z-index:9;left:0;top:0;pointer-events:none;font:900 22px/1 var(--font);color:#7a4a00;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:rise 1.3s forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px)}}
.fly{position:fixed;z-index:9;left:0;top:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,#ffc83d 55%,#d68b10);pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.6,1),opacity .7s}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#f3d9b5;transition:opacity .4s}
#loading.done{opacity:0;pointer-events:none}
#loading div{display:flex;flex-direction:column;align-items:center;gap:12px;font:800 16px/1 var(--font);color:var(--muted)}
#loading b{font:900 44px/1 var(--font);color:var(--ink)}
#loading .lb{width:180px;height:8px;border-radius:4px;background:#fff;overflow:hidden}#loading .lb i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* ---------- menus ---------- */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(14px + var(--safeT)) 14px calc(14px + var(--safeB));background:rgba(243,217,181,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sheet.dark{background:rgba(43,33,24,.4)}
.screen{width:min(100%,500px);max-height:100%;display:flex}
.card{width:100%;max-height:100%;display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:28px;padding:22px;box-shadow:0 20px 60px rgba(43,33,24,.25)}
.brand{text-align:center}
.brandbig{margin:0;font:900 clamp(46px,13vw,64px)/.95 var(--font);letter-spacing:-.02em}
.brandbig em{font-style:normal;color:var(--accent)}
.lead{margin:8px 0 0;font:700 17px/1.3 var(--font);color:var(--muted)}
.cta{min-height:56px;border-radius:16px;border:0;background:var(--accent);color:#fff;font:900 20px/1 var(--font);box-shadow:0 5px 0 #b85f17;padding:0 18px}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #b85f17}
.ghost{min-height:50px;border-radius:16px;border:0;background:#fff;font:800 17px/1 var(--font);box-shadow:0 0 0 2px var(--line)}
.toggle{display:inline-flex;align-items:center;gap:10px;border:0;background:none;font:800 16px/1 var(--font);padding:8px}
.toggle i{width:46px;height:28px;border-radius:14px;background:#d9c6b0;position:relative;transition:background .2s}
.toggle i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle[aria-pressed=true] i{background:var(--good)}.toggle[aria-pressed=true] i::after{left:21px}
.homeAudio{display:flex;justify-content:center}
.topbar{display:flex;align-items:center;justify-content:space-between}
.back{border:0;background:none;font:800 16px/1 var(--font);display:inline-flex;gap:6px;padding:6px 0}
.eyebrow{margin:0;font:800 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2{margin:0;font:900 26px/1.1 var(--font)}
.scroll{overflow:auto;min-height:0;flex:1 1 auto;margin:0 -6px;padding:2px 6px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:0;background:#fff;text-align:left;box-shadow:0 0 0 2px var(--line)}
.tile .sicon{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:hsl(var(--h,30) 80% 90%)}
.tile .sicon svg{width:24px;height:24px;fill:none;stroke:hsl(var(--h,30) 60% 30%);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}.tx strong{font:800 16px/1.15 var(--font)}.tx span{font:700 13px/1.2 var(--font);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:0;background:#fff;text-align:left;box-shadow:0 0 0 2px var(--line)}
.row[aria-pressed=true]{box-shadow:0 0 0 3px var(--accent);background:#fff5ea}
.radio{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px #cdbba6;background:#fff}
.row[aria-pressed=true] .radio{box-shadow:inset 0 0 0 6px var(--accent)}
.row .best{margin-left:auto;font:800 12px/1 var(--font);background:#fff1d2;color:#8a5a00;border-radius:10px;padding:5px 8px;white-space:nowrap}
.footer{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--line);padding-top:12px}
.lbl{margin:0;font:800 12px/1 var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:#f1e7da}
#modeSeg{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}
.seg button{border:0;border-radius:10px;background:none;padding:10px 6px;font:800 15px/1 var(--font);color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(43,33,24,.12)}
.over .head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bigscore{margin:0;font:900 56px/1 var(--font)}.bigscore small{font-size:26px;color:var(--muted)}
.sub{margin:0;font:700 15px/1.3 var(--font);color:var(--muted)}
.pill{display:inline-block;margin-top:4px;font:800 13px/1 var(--font);padding:6px 10px;border-radius:999px;background:#f1e7da}
.pill.best{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:#fff;border-radius:14px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;gap:3px;box-shadow:0 0 0 2px var(--line)}
.stats strong{font:900 22px/1 var(--font)}.stats span{font:800 11px/1.1 var(--font);color:var(--muted)}
.review h3{margin:4px 0 8px;font:900 18px/1 var(--font)}
.review ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.review li{background:#fff;border-radius:12px;padding:8px 10px;font:700 14px/1.3 var(--font);box-shadow:0 0 0 2px var(--line)}
.review li img{height:26px;vertical-align:middle;margin-right:6px;border-radius:3px}
.review li div{display:flex;flex-wrap:wrap;gap:8px;margin-top:3px}
.review s{color:#b3261e}.review b{color:#16733f}
.perfect{text-align:center;font:800 16px/1.3 var(--font);margin:6px 0}
.actions{display:flex;flex-direction:column;gap:8px}
.sent{margin:0;text-align:center;font:800 16px/1.3 var(--font);color:var(--muted)}
.credit{margin:0;text-align:center;font:700 11px/1.3 var(--font);color:var(--muted)}
@media (max-height:640px){.brandbig{font-size:46px}.card{padding:16px;gap:9px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="The café kitchen"></canvas>
  <div id="marks"></div>
  <div id="top" class="off">
    <div id="hud">
      <span class="chip coins" id="coinChip"><i class="coin"></i><span id="coins">0</span></span>
      <span class="chip" id="clockChip"><span id="clock"></span></span>
      <span class="chip mult" id="multChip">×<span id="multN">2</span>&nbsp;<span data-t>tips</span></span>
      <span class="sp"></span>
      <button type="button" id="mute" class="round" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="offi" d="M16 9l6 6M22 9l-6 6"/></svg></button>
      <button type="button" id="pauseBtn" class="round" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    </div>
    <div id="tickets" aria-label="Orders"></div>
  </div>
  <div id="hint" class="off"></div>
  <div id="banner"><span></span><small></small></div>

  <div id="card" class="off" role="dialog" aria-live="polite" aria-label="Question">
    <div class="ctop"><img id="cDish" alt=""><div><small data-t>Cook it right</small><b id="cName"></b></div></div>
    <div id="qwrap"><span id="qtag"></span><img id="qimg" alt="Flag" hidden><div id="qtext"></div></div>
    <div id="ans">
      <button type="button" data-i="0"><b>1</b><span></span></button>
      <button type="button" data-i="1"><b>2</b><span></span></button>
      <button type="button" data-i="2"><b>3</b><span></span></button>
    </div>
    <div id="verdict"></div>
  </div>
</div>

<div id="loading"><div><b data-noi18n>Cafefall</b><span data-t>Setting up the kitchen…</span><span class="lb"><i id="loadBar"></i></span></div></div>

<!-- Menus -->
<div id="sheet" hidden>
  <section class="screen" id="scrHome" hidden>
    <div class="card">
      <div class="brand">
        <h1 class="brandbig" data-noi18n>Cafe<em>fall</em></h1>
        <p class="lead" data-t>Answer right. Serve it hot.</p>
      </div>
      <button type="button" class="cta play" id="playBtn" data-go="stepSubj">Play</button>
      <div class="homeAudio"><button type="button" class="toggle" id="sndT" aria-pressed="true"><i></i>Sound</button></div>
      <p class="credit" data-t>3D art: KayKit by Kay Lousberg (CC0)</p>
    </div>
  </section>

  <section class="screen" id="stepSubj" hidden>
    <div class="card">
      <div class="topbar"><button type="button" class="back" data-go="scrHome"><span aria-hidden="true">←</span>Home</button><p class="eyebrow" data-t>Step 1 of 2</p></div>
      <h1>Choose a subject</h1>
      <div class="scroll"><div class="grid2" id="subjects"></div></div>
    </div>
  </section>

  <section class="screen" id="stepTopic" hidden>
    <div class="card">
      <div class="topbar"><button type="button" class="back" data-go="stepSubj"><span aria-hidden="true">←</span>Subjects</button><p class="eyebrow" data-t>Step 2 of 2</p></div>
      <h1 id="subName"></h1>
      <div class="scroll"><div class="list" id="topics"></div></div>
      <div class="footer">
        <p class="lbl">Difficulty</p>
        <div class="seg" id="diffSeg" role="group" aria-label="Difficulty">
          <button type="button" data-d="1">Easy</button><button type="button" data-d="2">Medium</button><button type="button" data-d="3">Hard</button>
        </div>
        <p class="lbl">Run length</p>
        <div class="seg" id="modeSeg" role="group" aria-label="Run length"></div>
        <button type="button" class="cta" id="startBtn" data-t>Open the café</button>
      </div>
    </div>
  </section>

  <section class="screen" id="pauseP" hidden>
    <div class="card over">
