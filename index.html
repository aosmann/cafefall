<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cafefall">
<meta name="theme-color" content="#9b5b34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Cafefall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: HUD on top, the café scene (one SVG that fills whatever space is left), the menu shelf at the bottom.
   The question card slides over the shelf (portrait) or sits over the scene (landscape). Everything in 100dvh. */
:root{--ink:#3b2416;--cream:#fff6e8;--choc:#9b5b34;--caramel:#e8933f;--mint:#5cc8a8;--berry:#ef5b7b;--good:#2fb36b;--bad:#e5484d;--gold:#ffc83d;
  --font:'Nunito',system-ui,sans-serif;--disp:'Fredoka','Nunito',system-ui,sans-serif;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fbe3c4;color:var(--ink);font:16px/1.35 var(--font);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;height:100vh;height:100dvh;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
#hud{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safeT)) 10px 6px;z-index:5;transition:opacity .25s}
#hud.off{opacity:0;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:999px;background:#fff;border:3px solid var(--ink);font:700 18px/1 var(--disp);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip.coins svg{width:24px;height:24px}
.chip.coins.pop{animation:pop .35s}
.chip.mult{background:var(--gold);display:none}
.chip.mult.on{display:inline-flex;animation:pop .4s}
.chip.low{background:#ffd6d6;color:#b3261e}
#hud .sp{flex:1}
.round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink)}
.round svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#mute .offi{display:none}#mute[aria-pressed=false] .on{display:none}#mute[aria-pressed=false] .offi{display:inline}
#mute path:first-child{fill:var(--ink)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- scene ---------- */
#stage{position:relative;flex:1;min-height:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.cust{cursor:pointer}
.cust .bub{transition:opacity .2s}
.cust.serving .ring{opacity:1}
.ring{opacity:0;transition:opacity .2s}
.cust.sad .head{filter:saturate(.4) brightness(.9)}
.body-paused *{animation-play-state:paused!important}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s infinite alternate}
@keyframes flick{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
.steam{animation:steam 1.2s infinite ease-out;opacity:0}
.steam:nth-child(2){animation-delay:.4s}.steam:nth-child(3){animation-delay:.8s}
@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-70px) scale(1.4)}}
#chef .happyEye,#chef .sweat{display:none}
#chef.happy .eye{display:none}#chef.happy .happyEye{display:inline}
#chef.oops .sweat{display:inline}
#chefBob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){#chefBob,.flame,.steam{animation:none!important}.steam{opacity:.5}}

/* ---------- shelf ---------- */
#shelf{flex:none;position:relative;z-index:3;padding:10px 10px calc(10px + var(--safeB));background:linear-gradient(#b8713f,#9b5b34);border-top:5px solid var(--ink);
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;transition:opacity .25s}
#shelf.off{opacity:.0;pointer-events:none}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 6px;border-radius:18px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 4px 0 var(--ink);min-height:84px}
.item svg{width:min(52px,11vw);height:min(52px,11vw)}
.item span{font:600 14px/1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.item.want{background:#fff;box-shadow:0 4px 0 var(--ink),0 0 0 4px var(--gold)}
.item i{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--berry);color:#fff;font:700 14px/24px var(--disp);font-style:normal;border:2px solid var(--ink);display:none}
.item.want i{display:block}
.item.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;background:var(--ink);color:#fff;font:700 15px/1.2 var(--font);padding:10px 16px;border-radius:14px;white-space:nowrap;transition:opacity .3s;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#hint.off{opacity:0}
#hint::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--ink)}

/* ---------- question card ---------- */
#card{position:absolute;left:0;right:0;bottom:0;z-index:6;margin:0 auto;width:min(100%,760px);background:var(--cream);border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;
  padding:14px 14px calc(14px + var(--safeB));box-shadow:0 -6px 0 rgba(59,36,22,.18);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 64px)}
#card.off{transform:translateY(110%);transition-timing-function:ease-in}
.ctop{display:flex;align-items:center;gap:10px}
.ctop .who{width:46px;height:46px;flex:none;display:grid;place-items:center}
.ctop .who img{max-width:46px;max-height:46px}
.ctop svg{width:44px;height:44px;flex:none}
.ctop b{font:700 19px/1.1 var(--disp)}
.ctop small{display:block;font:800 12px/1 var(--font);opacity:.6;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
#qwrap{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:auto}
#qtag{font:800 12px/1 var(--font);opacity:.55;letter-spacing:.04em;text-transform:uppercase}
#qtag:empty{display:none}
#qimg{height:72px;border-radius:6px;border:2px solid var(--ink)}
#qtext{font:800 clamp(18px,4.6vw,26px)/1.25 var(--font)}
#qtext .code{display:block;font:700 .82em/1.3 ui-monospace,Menlo,monospace;background:#2b1d14;color:#ffe8c4;padding:6px 10px;border-radius:8px;margin-bottom:6px;white-space:pre-wrap;text-align:left}
#ans{display:grid;gap:8px}
#ans button{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-radius:18px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font:800 clamp(17px,4.4vw,22px)/1.2 var(--font);text-align:left}
#ans button b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 17px/1 var(--disp)}
#ans button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#ans button.right{background:#c9f5d9;border-color:#16733f;box-shadow:0 4px 0 #16733f}
#ans button.right b{background:var(--good)}
#ans button.wrong{background:#ffd3d3;border-color:#9d2226;box-shadow:0 4px 0 #9d2226}
#ans button.wrong b{background:var(--bad)}
#ans button.dim{opacity:.45}
#ans.locked button{pointer-events:none}
#verdict{font:700 17px/1.2 var(--disp);text-align:center;min-height:0}
#verdict:empty{display:none}
#verdict.good{color:#16733f}#verdict.bad{color:#9d2226}
@media (min-width:640px){#ans{grid-template-columns:1fr}#ans button{min-height:48px;justify-content:center;text-align:center;min-height:88px;gap:6px}}
/* landscape phones and boards: the card floats over the scene, the shelf becomes one row */
@media (orientation:landscape) and (min-aspect-ratio:13/10){
  #shelf{grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:6px;padding-top:8px;padding-bottom:calc(8px + var(--safeB))}
  .item{min-height:0;flex-direction:row;justify-content:center;gap:8px;padding:6px}
  .item svg{width:40px;height:40px}
  #card{bottom:auto;top:calc(56px + var(--safeT));left:10px;right:auto;width:min(52%,620px);margin:0;border-radius:26px;border-bottom:4px solid var(--ink);box-shadow:0 8px 0 rgba(59,36,22,.25);max-height:calc(100% - 64px - var(--safeT));padding-bottom:14px}
  #card.off{transform:translateY(-130%)}
  #ans{grid-template-columns:repeat(3,1fr)}#ans button{flex-direction:row;min-height:52px;justify-content:center;text-align:center;gap:8px}
}
@media (orientation:landscape) and (max-height:500px){.chip{height:36px;font-size:16px}.round{width:38px;height:38px}#qtext{font-size:19px}#ans button{min-height:50px;font-size:17px}.item span{font-size:13px}.item svg{width:32px;height:32px}}

/* ---------- banners and effects ---------- */
#banner{position:absolute;left:50%;top:18%;z-index:7;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:var(--gold);border:4px solid var(--ink);border-radius:20px;padding:10px 22px;
  font:700 clamp(22px,6vw,34px)/1.1 var(--disp);text-align:center;box-shadow:0 5px 0 var(--ink);white-space:nowrap}
#banner small{display:block;font:800 15px/1.2 var(--font)}
#banner.show{animation:ban 1.7s forwards}
#banner.bad{background:#ffd3d3}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.fly{position:fixed;z-index:9;left:0;top:0;width:26px;height:26px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.6,1),opacity .7s}
.pop{position:fixed;z-index:9;left:0;top:0;pointer-events:none;font:700 22px/1 var(--disp);color:#7a4a00;-webkit-text-stroke:0;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:rise 1.3s forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* ---------- menus ---------- */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(14px + var(--safeT)) 14px calc(14px + var(--safeB));background:rgba(251,227,196,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet.dark{background:rgba(59,36,22,.45)}
.screen{width:min(100%,520px);max-height:100%;display:flex}
.card{width:100%;max-height:100%;display:flex;flex-direction:column;gap:12px;background:var(--cream);border:4px solid var(--ink);border-radius:28px;padding:20px;box-shadow:0 8px 0 var(--ink)}
.brand{text-align:center}
.brandbig{margin:0;font:700 clamp(52px,15vw,78px)/.95 var(--disp);letter-spacing:-.01em;color:var(--choc);text-shadow:0 4px 0 var(--ink)}
.brandbig em{font-style:normal;color:var(--berry)}
.lead{margin:8px 0 0;font:800 18px/1.3 var(--font)}
.homeArt{display:block;width:150px;height:150px;margin:0 auto -6px}
.cta{min-height:58px;border-radius:18px;border:3px solid var(--ink);background:var(--berry);color:#fff;font:700 22px/1 var(--disp);box-shadow:0 5px 0 var(--ink);padding:0 18px}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.ghost{min-height:50px;border-radius:16px;border:3px solid var(--ink);background:#fff;font:700 18px/1 var(--disp);box-shadow:0 4px 0 var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:10px;border:0;background:none;font:800 16px/1 var(--font);padding:8px}
.toggle i{width:46px;height:28px;border-radius:14px;background:#d9c6b0;border:3px solid var(--ink);position:relative;transition:background .2s}
.toggle i::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .2s}
.toggle[aria-pressed=true] i{background:var(--mint)}.toggle[aria-pressed=true] i::after{left:20px}
.homeAudio{display:flex;justify-content:center}
.topbar{display:flex;align-items:center;justify-content:space-between}
.back{border:0;background:none;font:800 16px/1 var(--font);display:inline-flex;gap:6px;padding:6px 0}
.eyebrow{margin:0;font:800 13px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;opacity:.6}
h1,h2{margin:0;font:700 28px/1.1 var(--disp)}
.scroll{overflow:auto;min-height:0;flex:1 1 auto;margin:0 -6px;padding:2px 6px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:3px solid var(--ink);background:#fff;text-align:left;box-shadow:0 4px 0 var(--ink)}
.tile .sicon{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:hsl(var(--h,30) 80% 88%)}
.tile .sicon svg{width:24px;height:24px;fill:none;stroke:hsl(var(--h,30) 60% 30%);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}.tx strong{font:800 16px/1.15 var(--font)}.tx span{font:700 13px/1.2 var(--font);opacity:.65}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:3px solid var(--ink);background:#fff;text-align:left}
.row[aria-pressed=true]{background:#ffe7c2;box-shadow:inset 0 0 0 2px var(--caramel)}
.radio{flex:none;width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.row[aria-pressed=true] .radio{background:radial-gradient(var(--berry) 45%,#fff 50%)}
.row .best{margin-left:auto;font:800 12px/1 var(--font);background:var(--gold);border:2px solid var(--ink);border-radius:10px;padding:4px 7px;white-space:nowrap}
.footer{display:flex;flex-direction:column;gap:8px;border-top:3px dashed rgba(59,36,22,.25);padding-top:10px}
.lbl{margin:0;font:800 13px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;opacity:.65}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;border:3px solid var(--ink);background:#fff}
#modeSeg{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}
.seg button{border:0;border-radius:12px;background:none;padding:10px 6px;font:800 15px/1 var(--font)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.over .head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bigscore{margin:0;font:700 56px/1 var(--disp)}.bigscore small{font-size:26px;opacity:.6}
.sub{margin:0;font:800 15px/1.3 var(--font);opacity:.75}
.pill{display:inline-block;margin-top:4px;font:800 13px/1 var(--font);padding:6px 10px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.pill.best{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:3px}
.stats strong{font:700 22px/1 var(--disp)}.stats span{font:800 11px/1.1 var(--font);opacity:.65}
.review h3{margin:4px 0 8px;font:700 18px/1 var(--disp)}
.review ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.review li{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font:700 14px/1.3 var(--font)}
.review li img{height:26px;vertical-align:middle;margin-right:6px;border:1px solid var(--ink);border-radius:3px}
.review li div{display:flex;flex-wrap:wrap;gap:8px;margin-top:3px}
.review s{color:#9d2226}.review b{color:#16733f}
.perfect{text-align:center;font:800 16px/1.3 var(--font);margin:6px 0}
.actions{display:flex;flex-direction:column;gap:8px}
.sent{margin:0;text-align:center;font:800 16px/1.3 var(--font);opacity:.8}
.credit{margin:0;text-align:center;font:700 11px/1.3 var(--font);opacity:.5}
@media (max-height:640px){.homeArt{width:110px;height:110px}.brandbig{font-size:52px}.card{padding:14px;gap:9px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="off">
    <span class="chip coins" id="coinChip"><svg viewBox="0 0 100 100"><use href="#coin"/></svg><span id="coins">0</span></span>
    <span class="chip" id="clockChip"><span id="clock"></span></span>
    <span class="chip mult" id="multChip" aria-label="Tip multiplier">×<span id="multN">2</span> <span data-t>tips</span></span>
    <span class="sp"></span>
    <button type="button" id="mute" class="round" aria-label="Sound" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="offi" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    <button type="button" id="pauseBtn" class="round" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  </div>

  <div id="stage">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="110 40 890 560" preserveAspectRatio="xMidYMax meet" aria-label="Café counter">
      <defs>
        <!-- coin -->
        <symbol id="coin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#ffc83d" stroke="#3b2416" stroke-width="7"/><circle cx="50" cy="50" r="30" fill="none" stroke="#e8a412" stroke-width="6"/><path d="M42 34h12a8 8 0 0 1 0 16H44h12a8 8 0 0 1 0 16H42z" fill="none" stroke="#b9780a" stroke-width="5" stroke-linejoin="round"/></symbol>
        <!-- menu items (all original, no brands). viewBox 100×100, ink outlines -->
        <symbol id="i-toast" viewBox="0 0 100 100"><g stroke="#3b2416" stroke-width="5" stroke-linejoin="round"><path d="M22 88V46c-9-3-13-10-11-19C14 15 30 9 50 9s36 6 39 18c2 9-2 16-11 19v42z" fill="#d68b43"/><path d="M30 80V42c-7-2-9-7-7-12 3-9 14-13 27-13s24 4 27 13c2 5 0 10-7 12v38z" fill="#ffd98f" stroke="none"/><rect x="36" y="40" width="28" height="20" rx="5" fill="#fff3a6" stroke-width="4"/></g><path d="M41 45h10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>

<!-- Menus -->
<div id="sheet">
  <section class="screen" id="scrHome">
    <div class="card">
      <svg class="homeArt" viewBox="-120 -190 240 260" aria-hidden="true"><use href="#chefHead"/></svg>
      <div class="brand">
        <h1 class="brandbig" data-noi18n>Cafe<em>fall</em></h1>
        <p class="lead" data-t>Answer right. Serve it hot.</p>
      </div>
      <button type="button" class="cta play" id="playBtn" data-go="stepSubj">Play</button>
      <div class="homeAudio"><button type="button" class="toggle" id="sndT" aria-pressed="true"><i></i>Sound</button></div>
      <p class="credit" data-t>Animal art: Kenney.nl (CC0)</p>
    </div>
  </section>

  <section class="screen" id="stepSubj" hidden>
    <div class="card">
      <div class="topbar"><button type="button" class="back" data-go="scrHome"><span aria-hidden="true">←</span>Home</button><p class="eyebrow">Step 1 of 2</p></div>
      <h1>Choose a subject</h1>
      <div class="scroll"><div class="grid2" id="subjects"></div></div>
    </div>
  </section>

  <section class="screen" id="stepTopic" hidden>
    <div class="card">
      <div class="topbar"><button type="button" class="back" data-go="stepSubj"><span aria-hidden="true">←</span>Subjects</button><p class="eyebrow">Step 2 of 2</p></div>
      <h1 id="subName"></h1>
      <div class="scroll"><div class="list" id="topics"></div></div>
      <div class="footer">
        <p class="lbl">Difficulty</p>
        <div class="seg" id="diffSeg" role="group" aria-label="Difficulty">
          <button type="button" data-d="1">Easy</button><button type="button" data-d="2">Medium</button><button type="button" data-d="3">Hard</button>
        </div>
        <p class="lbl">Run length</p>
        <div class="seg" id="modeSeg" role="group" aria-label="Run length"></div>
        <button type="button" class="cta" id="startBtn" data-t>Open the café</button>
      </div>
    </div>
  </section>

  <section class="screen" id="pauseP" hidden>
    <div class="card over">
      <div class="head"><p class="eyebrow">Paused</p><p class="bigscore" id="pScore">0</p><p class="sub" id="pLine"></p></div>
      <div class="homeAudio"><button type="button" class="toggle" id="sndT2" aria-pressed="true"><i></i>Sound</button></div>
      <div class="actions">
        <button type="button" class="cta" id="resumeBtn">Resume</button>
        <button type="button" class="ghost" id="quitBtn">End run</button>
      </div>
    </div>
  </section>

  <section class="screen" id="over" hidden>
    <div class="card over">
      <div class="head">
        <p class="eyebrow" id="rCause"></p>
        <p class="bigscore"><span id="rServed">0</span><small> / <span id="rOrders">0</span></small></p>
        <p class="sub" data-t>customers served</p>
        <span class="pill" id="rBest"></span>
        <p class="sub" id="rTopic"></p>
      </div>
      <div class="stats">
        <div><strong id="rCoins">0</strong><span>Coins</span></div>
        <div><strong id="rStreak">0</strong><span>Best streak</span></div>
        <div><strong id="rRight">0</strong><span>Answers right</span></div>
        <div><strong id="rLeft">0</strong><span data-t>Walked out</span></div>
      </div>
      <div class="scroll review" id="review"></div>
      <div class="actions" id="overActions">
        <button type="button" class="cta" id="againBtn">Play again</button>
        <button type="button" class="ghost" id="menuBtn">Choose another topic</button>
      </div>
    </div>
  </section>
</div>
